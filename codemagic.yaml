workflows:
  al-mihani-android:
    name: Al Mihani Android AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Create Android project if missing
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync web assets
        script: npx cap sync android
      - name: Build release AAB (unsigned unless signing is configured)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
